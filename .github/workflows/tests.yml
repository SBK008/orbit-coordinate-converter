# Runs the test suite on every push and pull request.
# Results show as a green check (or red X) next to each commit on GitHub.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:     # adds a "Run workflow" button on the Actions tab
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is pinned to an LTS release so a new "latest" Ubuntu without
        # builds of these Python versions can't break the tests
        os: [ubuntu-24.04, macos-latest, windows-latest]
        # Oldest and newest supported Python versions
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install the app and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Run tests
        if: runner.os != 'Linux'
        run: python -m pytest -v

      - name: Install a virtual display for the desktop app tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests, including the desktop app (virtual display)
        if: runner.os == 'Linux'
        env:
          RUN_GUI_TESTS: "1"
        run: xvfb-run -a python -m pytest -v

  # Installs the oldest versions allowed by pyproject.toml, so the lower bounds
  # there are tested, not guessed. Raise these together with the lower bounds.
  oldest-deps:
    name: Oldest dependencies / Python 3.11
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install the app with the oldest supported dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.24.*" "pandas==2.0.*" "pyproj==3.6.*" "astropy==6.0.*" "pytest==7.*" .

      - name: Run tests
        run: python -m pytest -v
