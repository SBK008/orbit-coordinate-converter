# Dependabot opens pull requests when the GitHub Actions or Python packages
# this project uses have new versions. Each pull request runs the full test
# suite, so an update is merged only after every check passes.
version: 2
updates:
  # Actions in .github/workflows are pinned to commit SHAs. Dependabot updates
  # the SHA and the version comment next to it together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # Python packages listed in pyproject.toml and requirements.txt.
  # Bounds are ranges like "numpy>=1.24,<3". "increase-if-necessary" changes
  # a range only when a new release falls outside it, such as numpy 3.0.
  # (pip doesn't support "widen".)
  - package-ecosystem: pip
    directory: /
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      python-packages:
        patterns: ["*"]

  # Tools that build the standalone apps (packaging/requirements.txt)
  - package-ecosystem: pip
    directory: /packaging
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      build-tools:
        patterns: ["*"]
